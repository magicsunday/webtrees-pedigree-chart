# Deptrac configuration — imports the shared magicsunday/coding-standard ruleset
# (^3.0: one strict, acyclic order Support < Enum < Model, Configuration < Contract
# < Repository, Adapter, Service < Facade < Module; a layer depends only on layers
# below it). This repository installs its dev tooling into .build/vendor, so the
# import path points there (as the PHPStan include does). `composer
# ci:test:php:deptrac` runs the analysis, `deptrac debug:unassigned` and the
# layer-cycle gate (check-deptrac-cycles.php).
imports:
    - .build/vendor/magicsunday/coding-standard/deptrac/layers.yaml

deptrac:
    paths:
        - src

    # `Facade\` and `Model\` are canonical (the shared directory layers cover them),
    # and the module-behaviour traits now live under `Module\` (also directory-covered).
    # The `Module` and `Configuration` entry classes stay at the source root — a single
    # class is its own layer, and moving it into a same-named subdirectory would only
    # produce a redundant `Module/Module.php` and churn the entry FQCN — so each is
    # mapped to its canonical layer by an exact FQCN (which cannot collide with a vendor
    # class). These entries only add a collector to the shared layer of the same name;
    # the shared `directory` collectors do not match a root-level file, and the
    # ruleset for both layers is the shared one, unchanged.
    layers:
        -
            name: Module
            collectors:
                -
                    type: classNameRegex
                    value: '#^MagicSunday\\Webtrees\\PedigreeChart\\Module$#'
        -
            name: Configuration
            collectors:
                -
                    type: classNameRegex
                    value: '#^MagicSunday\\Webtrees\\PedigreeChart\\Configuration$#'
